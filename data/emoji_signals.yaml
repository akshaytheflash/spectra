# Curated emoji signals for illicit-trade detection.
#
# Emojis are a first-class signal in this domain: listings often replace the
# product word with one or two emojis (e.g. "fresh stock 🍁🔌"). The classifier
# still reads the text; this file gives the analyst an explicit, auditable
# emoji read-out and supplies a small confidence boost for emoji-led ads.
#
# weight: 0.9 strong / 0.6 moderate / 0.3 weak-or-ambiguous
# `ambiguous: true` means the emoji is common in benign conversation and only
# counts when a sale intent or another signal is also present.

version: 1

signals:
  # ---- narcotics -----------------------------------------------------------
  - {emoji: "🍁", category: drugs, meaning: "cannabis / weed", weight: 0.95}
  - {emoji: "🌿", category: drugs, meaning: "herb / cannabis", weight: 0.7}
  - {emoji: "☘️", category: drugs, meaning: "cannabis", weight: 0.6}
  - {emoji: "🍀", category: drugs, meaning: "cannabis", weight: 0.5, ambiguous: true}
  - {emoji: "❄️", category: drugs, meaning: "cocaine / snow", weight: 0.85}
  - {emoji: "💊", category: drugs, meaning: "pills / MDMA / pharma", weight: 0.55, ambiguous: true}
