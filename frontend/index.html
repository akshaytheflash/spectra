<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f1f3ed" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1210" media="(prefers-color-scheme: dark)" />
    <title>SPECTRA — Rajasthan Police OSINT</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231d6a56'/%3E%3Cpath d='M8 11h16M8 16h11M8 21h6' stroke='%23f1f3ed' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('spectra.theme');
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = saved || (dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body class="bg-base text-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
